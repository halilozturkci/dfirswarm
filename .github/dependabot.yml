version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The type definitions follow the runtime (.nvmrc, engines.node): a
      # newer major would let code use APIs Node 22 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned on purpose and moved by hand. Pi is also pinned in
      # images/base.Dockerfile (PI_VERSION), which the VMs run, so a bump
      # here alone splits host-mode seats from VM seats. The VM isolation
      # was measured on this microsandbox (scripts/swarm.sh warns on any
      # other), and 0.7.3 turned on a strict hostname policy that leaves a
      # VM no allowed host.
      - dependency-name: "@earendil-works/pi-coding-agent"
      - dependency-name: "microsandbox"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The images' inputs. Each opens a pull request that a person reviews; none
  # is merged by itself. The base image digests in images/base.Dockerfile and
  # tests/linux/Dockerfile move here; the apt snapshot date is moved by
  # .github/workflows/apt-snapshot.yml. The pinned downloads of the packs
  # (requires/host.json) are not an ecosystem Dependabot reads: the weekly
  # .github/workflows/pins.yml asks every one of them.
  - package-ecosystem: docker
    directory: /images
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # A Node major moves by hand, with the images' own tests.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /tests/linux
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # The Linux test image follows .nvmrc and engines.node: a newer major
      # moves with them.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /images
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /spikes/microvm-smoke
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Same hold as the root: measured on this microsandbox.
      - dependency-name: "microsandbox"
