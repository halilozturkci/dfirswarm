# Everything here runs without a model, a provider key, Herdr or Pi: the
# protocol suite works on files, the web API suite on a local server, the
# shell suites on the scripts themselves and a scripted provider.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Every night, everything (the select job below says so for any run that is
  # not a pull request): what a pull request's narrow run left out is run
  # within a day, on main as it is.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# A new push to a pull request cancels the runs the older push left behind (a
# queued run stops costing a macOS slot, a running one stops at once). Runs on
# pushes to main, on tags, on schedules and by hand get their own group (the
# run id) and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  select:
    # Which suites this run needs. A pull request runs the suites that read
    # what it changed (scripts/test-select.ts: narrow only where the change
    # plainly is, everything for the harness, the workflow, images, package
    # files, two packs' tools and any path it does not know); a push to main,
    # the nightly run, a run by hand and a pull request labelled full-ci run
    # everything. What a narrow run leaves out runs on main once it merges and
    # every night. vm says whether the microVM job is needed: everything, or a
    # pack's requirements (the images are built from them).
    name: which suites this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.s.outputs.all }}
      vm: ${{ steps.s.outputs.vm }}
      node: ${{ steps.s.outputs.node }}
      shell: ${{ steps.s.outputs.shell }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The change is read as base...head, so the history is needed.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: s
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$FULL_LABEL" = true ]; then
            why="$([ "$EVENT" != pull_request ] && echo "a $EVENT run" || echo "the full-ci label")"
            { echo "all=true"; echo "vm=true"; echo "node="; echo "shell="; } >> "$GITHUB_OUTPUT"
            echo "**Everything** ($why)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --experimental-strip-types --no-warnings scripts/test-select.ts --base "$BASE" --json > "$RUNNER_TEMP/select.json"
          q() { node -e "const s = require(process.argv[1]); process.stdout.write(String($1))" "$RUNNER_TEMP/select.json"; }
          all="$(q 's.all')"
          vm="$(q "s.all || s.changed.some((p) => /^packs\/[^/]+\/requires\//.test(p))")"
          { echo "all=$all"; echo "vm=$vm"
            echo "node<<SELECT_EOF"; q 's.node.join("\n")'; echo; echo "SELECT_EOF"
            echo "shell<<SELECT_EOF"; q 's.shell.join("\n")'; echo; echo "SELECT_EOF"; } >> "$GITHUB_OUTPUT"
          { echo "**$( [ "$all" = true ] && echo Everything || echo "$(q 's.node.length') node suites, $(q 's.shell.length') shell suites")** for $(q 's.changed.length') changed file(s); microVM job: $vm."
            echo; q 's.reasons.map((r) => "- " + r).join("\n")'; echo; } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: linux · ${{ matrix.part }}
    needs: select
    runs-on: ubuntu-latest
    # One job of six, run side by side. As one job it was the longest of the
    # run and the one every pull request waited for: 67 min 12 s on a green run
    # of 2026-10-27 (npm test 31 min 36 s, test:bash 24 min 6 s, the browser 8
    # min 36 s, the tools 2 min 12 s), 36 to 59 min 54 s over 60 runs before
    # that, cut off four times. Now the node suites are three parts (node's own
    # --test-shard), the shell suites two (dealt out by tests/shell-suites.weights),
    # and the UI build and the tracked-files check one of their own;
    # tests/ci-shards.test.ts holds the parts to cover every node suite and every
    # shell suite exactly once, as it does the macOS job's. A limit is there to
    # stop a hang: every test has its own 5-minute limit (scripts/test-node.ts).
    timeout-minutes: ${{ matrix.node && 60 || 45 }}
    strategy:
      # A failing part does not cancel the others: their verdicts are wanted.
      fail-fast: false
      matrix:
        include:
          - part: typecheck · node tests 1/3
            node: "1/3"
            typecheck: true
          - part: node tests 2/3
            node: "2/3"
          - part: node tests 3/3
            node: "3/3"
          - part: shell suites 1/2
            shard: "1/2"
          - part: shell suites 2/2
            shard: "2/2"
          - part: ui build · nothing from a run is tracked
            ui: true
    steps:
      # actions/checkout runs `git init` on the runner, and git prints its
      # init.defaultBranch hint unless one is configured.
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tools the shell suites use
        if: ${{ !matrix.ui }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq python3 zsh bubblewrap util-linux iproute2 sqlite3
          jq --version && python3 --version && bash --version | head -1
      # Ubuntu 24.04 switches unprivileged user namespaces off for programs
      # without an AppArmor profile, and the guard suites then test nothing:
      # fsguard falls back to Landlock alone and says so. Switch them on here so
      # CI exercises the namespace modes; the second job below covers the
      # Landlock-only host on purpose.
      - name: What this host can enforce
        if: ${{ !matrix.ui }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "userns: $(unshare -rm true 2>/dev/null && echo yes || echo no)"
          echo "netns:  $(unshare -rn true 2>/dev/null && echo yes || echo no)"
          echo "landlock ABI: $(python3 scripts/landlock.py --dry-run -- true | sed -n 's/^abi: //p')"
          echo "bwrap:  $(bwrap --version 2>/dev/null || echo none)"
          bash scripts/fsguard.sh --rw "$PWD" --dry-run -- true | head -4
      - run: npm ci
      # The Playwright tool test drives a real browser and skips its browser
      # half without one. The headless shell is what it launches. The browser
      # is a 3-second download; --with-deps' apt fetch of its libraries is what
      # took 8 min 28 s (25.9 MB at 51 kB/s on 2026-10-27), and the hosted image
      # already holds what the shell links. So the browser alone, a launch to
      # prove it, and --with-deps only when that launch fails.
      - name: Chromium for the Playwright tool test
        if: matrix.node
        run: |
          npx playwright install --only-shell chromium
          launch() { node -e "require('playwright').chromium.launch().then((b) => b.close()).catch((e) => { console.error(e.message); process.exit(1); })"; }
          if launch; then echo "the headless shell starts with the image's own libraries"; else
            echo "the headless shell does not start: installing its libraries"
            npx playwright install --with-deps --only-shell chromium
            launch
          fi
      - name: Typecheck
        if: matrix.typecheck
        run: npm run typecheck
      # A pull request's narrow run: the select job's lists, as the files the
      # node and shell steps below are handed.
      - name: The suites this change needs
        if: needs.select.outputs.all != 'true'
        env:
          NODE_LIST: ${{ needs.select.outputs.node }}
          SHELL_LIST: ${{ needs.select.outputs.shell }}
        run: |
          printf '%s\n' "$NODE_LIST" | grep . > "$RUNNER_TEMP/node.list" || true
          printf '%s\n' "$SHELL_LIST" | grep . > "$RUNNER_TEMP/shell.list" || true
          echo "narrow: $(wc -l < "$RUNNER_TEMP/node.list") node suite(s), $(wc -l < "$RUNNER_TEMP/shell.list") shell suite(s) in all"
      # The browser is installed in every node part, so its tests may not skip.
      - name: Node tests ${{ matrix.node }}
        if: matrix.node
        run: npm test -- --test-shard=${{ matrix.node }} --timings=${{ runner.temp }}/timings.json ${{ needs.select.outputs.all != 'true' && format('--files-from={0}/node.list', runner.temp) || '' }}
        env:
          SWARM_REQUIRE_BROWSER: "1"
      - name: The slowest node suites of this part
        if: always() && matrix.node
        run: |
          [ -s "$RUNNER_TEMP/timings.json" ] || exit 0
          node --experimental-strip-types --no-warnings scripts/test-timings.ts summary "$RUNNER_TEMP/timings.json" --top 15 >> "$GITHUB_STEP_SUMMARY"
      - name: Shell suites ${{ matrix.shard }}
        if: matrix.shard
        run: npm run test:bash -- --shard ${{ matrix.shard }} ${{ needs.select.outputs.all != 'true' && format('--within={0}/shell.list', runner.temp) || '' }}
      - name: UI build
        if: matrix.ui
        run: npm run ui:build
      - name: Nothing from a run is tracked
        if: matrix.ui
        run: |
          if git ls-files | grep -E '^(runs/|sandbox-runs/|sandbox/\.pi|sandbox/traces/)' ; then
            echo "run state is tracked" >&2; exit 1
          fi

  node-floor:
    # The oldest Node the harness claims, run exactly: package.json engines
    # says >=22.19 because the pinned Pi and its undici declare 22.19.0 as
    # their own floor, and an older 22 cannot load the extension (measured on
    # 22.6.0: undici calls webidl.util.markAsUncloneable, which that Node has
    # not got, and every test that loads Pi fails). .nvmrc's 22 above is the
    # newest 22; this is the floor, so the claim is tested, not assumed.
    name: typecheck · node tests · Node 22.19 (the engines floor)
    needs: select
    runs-on: ubuntu-latest
    # The node suites alone take 13 to 20 min now (the slowest success 20 min 0 s
    # of the 20): 35, the same step up as the job above. Over the last 60 runs
    # the 43 successes took 20 to 34 min (the slowest 33 min 54 s of the 35) and
    # two runs were cut off at the limit on a slow host, so now 55 (1.6 times
    # the slowest success).
    timeout-minutes: 55
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Tools the suites use
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq python3 zsh bubblewrap util-linux iproute2 sqlite3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          test "$(node --version)" = v22.19.0 || { echo "wanted Node v22.19.0, got $(node --version)" >&2; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - name: The suites this change needs
        if: needs.select.outputs.all != 'true'
        env:
          NODE_LIST: ${{ needs.select.outputs.node }}
        run: printf '%s\n' "$NODE_LIST" | grep . > "$RUNNER_TEMP/node.list" || true
      - name: Node tests
        run: npm test -- --timings=${{ runner.temp }}/timings.json ${{ needs.select.outputs.all != 'true' && format('--files-from={0}/node.list', runner.temp) || '' }}
      - name: The slowest node suites
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/timings.json" ] || exit 0
          node --experimental-strip-types --no-warnings scripts/test-timings.ts summary "$RUNNER_TEMP/timings.json" --top 15 >> "$GITHUB_STEP_SUMMARY"

  node-24:
    # Two Nodes run this harness. The host runs .nvmrc's 22 (package.json
    # engines >=22.19; the job above runs that floor exactly); inside a VM, Pi
    # runs the extensions on the image's Node, and images/base.Dockerfile
    # builds on node:24. The node suites again, on 24.
    name: node tests · Node 24 (the VM image's)
    needs: select
    runs-on: ubuntu-latest
    # 14 to 19 min now (the slowest success 19 min 12 s of the 20): 35. Over the
    # last 60 runs the 48 successes took 19 to 32 min (the slowest 32 min 24 s of
    # the 35, none cut off yet), so the same 55 as the Node 22.19 job.
    timeout-minutes: 55
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tools the suites use
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq python3 zsh bubblewrap util-linux iproute2 sqlite3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          node --version
      - run: npm ci
      - name: The suites this change needs
        if: needs.select.outputs.all != 'true'
        env:
          NODE_LIST: ${{ needs.select.outputs.node }}
        run: printf '%s\n' "$NODE_LIST" | grep . > "$RUNNER_TEMP/node.list" || true
      - name: Node tests
        run: npm test -- --timings=${{ runner.temp }}/timings.json ${{ needs.select.outputs.all != 'true' && format('--files-from={0}/node.list', runner.temp) || '' }}
      - name: The slowest node suites
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/timings.json" ] || exit 0
          node --experimental-strip-types --no-warnings scripts/test-timings.ts summary "$RUNNER_TEMP/timings.json" --top 15 >> "$GITHUB_STEP_SUMMARY"

  replay-impact:
    # A pull request's impact line (scripts/replay-impact.ts): every contract
    # fixture replayed under the pull request's base and under its head, each
    # difference named in the job's summary. A difference is what a rule
    # change reaches, never a failure; the job fails only when nothing could
    # be replayed.
    if: github.event_name == 'pull_request'
    name: replay impact · contract fixtures, base against head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit is read with git archive, so the history is needed.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Replay the contract fixtures under the base and this change
        run: node --experimental-strip-types --no-warnings scripts/replay-impact.ts "${{ github.event.pull_request.base.sha }}"

  pack-versions:
    # A pack whose content differs from the base's carries a version above it
    # (docs/packs.md, "Versions"). Two branches that changed one pack can merge
    # without a conflict and land two different packs under one number, and
    # the seal and packs.test.sh hold for both: only a comparison with the base
    # sees it. A pull request against its base; a push to main against the
    # commit before it.
    name: pack versions · base against head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base's pack.json files are read with git show, so the history is needed.
          fetch-depth: 0
      - name: Every changed pack's version is above the base's
        run: python3 scripts/pack-versions.py --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

  guards-without-namespaces:
    # The host a run meets inside an ordinary container, or on an Ubuntu with
    # its AppArmor restriction left on: no user namespaces, Landlock only.
    # The guard suites must pass there too, with the record saying what the
    # host could not enforce rather than the guard pretending.
    name: guard suites · Landlock only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq python3 zsh sqlite3
          sudo sysctl -w user.max_user_namespaces=0
          echo "userns: $(unshare -rm true 2>/dev/null && echo yes || echo no) (expected: no)"
          echo "landlock ABI: $(python3 scripts/landlock.py --dry-run -- true | sed -n 's/^abi: //p')"
      - run: npm ci
      - run: bash scripts/test-bash.sh write-guard herdr-seal inputs netguard trace-gate

  macos:
    # The platform the harness is developed and demoed on, and the one with
    # its own code paths: the seatbelt write guard (sandbox-exec), host panes
    # under it, --inputs-image (hdiutil), caffeinate and the battery check,
    # the synced-folder check, bash 3.2 and BSD tools. A hosted runner cannot
    # boot a microVM (no nested virtualisation), so the VM suite stays on the
    # Linux job below; everything else runs here. Docker is not on the runner:
    # evidence-image runs its hdiutil half and says it skipped the container
    # half. Herdr is not either: swarm-preflight skips its keyless-kickoff
    # check and says so.
    name: macOS · ${{ matrix.part }}
    needs: select
    # The owner's own Macs, when the repository variable MACOS_RUNNER names
    # their labels (a JSON array, '["self-hosted","macOS","ARM64","dfirswarm"]'),
    # and only for code the owner wrote: a push to main, or a pull request the
    # owner opened from a branch of this repository. A fork's pull request, a
    # Dependabot one and everything else stay on GitHub's hosted runner, and
    # deleting the variable sends every run back there. A fork can edit this
    # line in its own pull request, so the Mac does not trust it: its job-started
    # hook checks the same rule from the event GitHub sent and fails any other
    # job before a step runs (docs/macos-runners.md).
    runs-on: >-
      ${{ vars.MACOS_RUNNER
          && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
              || (github.event_name == 'pull_request'
                  && github.event.pull_request.head.repo.full_name == github.repository
                  && github.event.pull_request.user.login == github.repository_owner))
          && fromJSON(vars.MACOS_RUNNER)
          || 'macos-latest' }}
    # One job of four, run side by side. The one job that did all of it took
    # 44 minutes of the 55 (typecheck and node tests 12, shell suites 31, over
    # three pushes to main), and a grown suite had already needed reruns. Now
    # the node tests are two jobs (node's own --test-shard, which deals the
    # sorted suite files out round-robin) and the shell suites are two, dealt
    # out by the time each takes (tests/shell-suites.weights): 12 to 19
    # minutes each over
    # the first three runs. A job's limit is there to stop a hang, so the shell
    # parts keep 55; the node parts are given more, below.
    # tests/ci-shards.test.ts holds the four parts to cover every node suite and
    # every shell suite exactly once, so a new suite is never in no job.
    #
    # The node part is the slow one on a hosted runner, and its speed varies:
    # 13 to 46 minutes over 35 runs (median about 37), then 55 minutes twice on
    # 2026-10-22, when the same suite ran at about half speed. The first was cut
    # off with 3911 of 4550 tests done, the second finished all of them (0
    # failed) 53.6 minutes in and was still marked cancelled by the limit. So
    # the node parts get 90; the shell parts (12 to 22 minutes) keep 55. A hang is
    # still stopped: every test has its own 5-minute limit (scripts/test-node.ts).
    timeout-minutes: ${{ matrix.node && 90 || 55 }}
    strategy:
      # A failing part does not cancel the others: their verdicts are wanted.
      fail-fast: false
      matrix:
        include:
          # The typecheck runs in the first node part only, so no costly
          # work is done twice; the Playwright browser is in both, because
          # which part gets the Playwright suite follows the file order.
          - part: typecheck · node tests 1/2
            node: "1/2"
            typecheck: true
          - part: node tests 2/2
            node: "2/2"
          - part: shell suites 1/2
            shard: "1/2"
          - part: shell suites 2/2
            shard: "2/2"
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Python the suites run, named rather than taken from the host: the
      # hosted runner's python3 is 3.14, a Mac's own may be the 3.9 of the
      # command line tools. The Linux jobs run Ubuntu 24.04's 3.12, so the two
      # supported ends are both tested. On the owner's Mac it is Homebrew's
      # python@3.14 (scripts/macos-runner-setup.sh requires it): setup-python
      # installs a macOS Python with sudo, which the job user does not have.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.14"
      - name: Python 3.14 from Homebrew (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          bin=/opt/homebrew/opt/python@3.14/libexec/bin
          "$bin/python3" -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
          echo "$bin" >> "$GITHUB_PATH"
      - name: Tools the shell suites use
        run: |
          command -v jq >/dev/null || brew install jq
          jq --version && python3 --version && /bin/bash --version | head -1 && zsh --version
          sqlite3 --version
          echo "sandbox-exec: $(command -v sandbox-exec || echo none)"
      - run: npm ci
      - name: Chromium for the Playwright tool test
        if: matrix.node
        run: npx playwright install --only-shell chromium
      - name: Typecheck
        if: matrix.typecheck
        run: npm run typecheck
      - name: The suites this change needs
        if: needs.select.outputs.all != 'true'
        env:
          NODE_LIST: ${{ needs.select.outputs.node }}
          SHELL_LIST: ${{ needs.select.outputs.shell }}
        run: |
          printf '%s\n' "$NODE_LIST" | grep . > "$RUNNER_TEMP/node.list" || true
          printf '%s\n' "$SHELL_LIST" | grep . > "$RUNNER_TEMP/shell.list" || true
      # node --test runs as many files at once as the host has cores less one:
      # two on the hosted runner (three vCPU), nine on a ten-core Mac mini, where
      # the timing-bound suites then ran past their limits. Three on the
      # owner's Mac keeps the two comparable.
      - name: Node tests ${{ matrix.node }}
        if: matrix.node
        run: npm test -- --test-shard=${{ matrix.node }} --timings=${{ runner.temp }}/timings.json ${{ needs.select.outputs.all != 'true' && format('--files-from={0}/node.list', runner.temp) || '' }} ${{ runner.environment == 'self-hosted' && '--test-concurrency=3' || '' }}
      - name: The slowest node suites of this part
        if: always() && matrix.node
        run: |
          [ -s "$RUNNER_TEMP/timings.json" ] || exit 0
          node --experimental-strip-types --no-warnings scripts/test-timings.ts summary "$RUNNER_TEMP/timings.json" --top 15 >> "$GITHUB_STEP_SUMMARY"
      - name: Shell suites ${{ matrix.shard }}
        if: matrix.shard
        run: npm run test:bash -- --shard ${{ matrix.shard }} ${{ needs.select.outputs.all != 'true' && format('--within={0}/shell.list', runner.temp) || '' }}

  microvm:
    # Agents in microVMs (--isolation microvm), on real VMs: GitHub's Linux
    # runners expose /dev/kvm. The base image is built here from
    # images/base.Dockerfile rather than pulled, so a pull request that changes
    # it is tested with the change. Nothing is pushed from this repository:
    # images.yml builds every profile (and two for arm64) and checks each
    # from the inside; this job boots base and disk on every pull request, and
    # image-boot.yml boots every profile once a week.
    name: microVM · integration tests (KVM)
    # Every run that runs everything, and a pull request that changes a pack's
    # requirements (the disk image is built from them); a narrow one that does
    # not change what the VMs boot leaves it out (the select job's vm).
    needs: select
    if: needs.select.outputs.vm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The VM suite checks that a finish clears a removed VM's secret from
      # msb's database, which needs the sqlite3 CLI on the host; installed
      # here rather than trusted to the runner image.
      - name: sqlite3, for the msb database scrub
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sqlite3
          sqlite3 --version
      - name: KVM for this user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - run: npm ci
      # Building the two images took 4 min 24 s of the job's 6 min 54 s
      # (2026-10-27), and what goes into them is images/ and the packs'
      # requirements: no pack's tools are copied in (images/recipe.py). So
      # the saved images are kept under a key of those files, and of the ISO
      # week, because the base installs Debian's current packages: a week-old
      # build is rebuilt, and an upstream change is met within a week here and
      # at once in images.yml, which builds every profile from scratch.
      - name: The week the image cache is keyed by
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: images
        with:
          path: |
            ${{ runner.temp }}/base.tar
            ${{ runner.temp }}/disk.tar
          key: vm-images-amd64-${{ hashFiles('images/**', 'packs/*/requires/**') }}-${{ steps.week.outputs.week }}
      - name: The base and disk images, built and loaded into msb
        run: |
          if [ "${{ steps.images.outputs.cache-hit }}" = true ]; then
            echo "the base and disk images of this week and these files, from the cache"
          else
            docker build -f images/base.Dockerfile -t dfirswarm-base:dev-amd64 images
            # disk as well: the catalog test needs The Sleuth Kit, and a pack
            # image that is only ever built and never booted is untested. Not
            # published, so the licence flag is for this runner only.
            python3 images/recipe.py build disk --out "$RUNNER_TEMP/disk" --base dfirswarm-base:dev-amd64 --allow-nonredistributable
            docker build -t dfirswarm-disk:dev-amd64 "$RUNNER_TEMP/disk"
            docker save dfirswarm-base:dev-amd64 -o "$RUNNER_TEMP/base.tar"
            docker save dfirswarm-disk:dev-amd64 -o "$RUNNER_TEMP/disk.tar"
          fi
          msb="$(node --experimental-strip-types --no-warnings scripts/vm.ts msb-path)"
          "$msb" doctor
          "$msb" load -i "$RUNNER_TEMP/base.tar"
          "$msb" load -i "$RUNNER_TEMP/disk.tar"
      - name: VM integration tests
        env:
          DFIRSWARM_VM_TESTS: "1"
          VM_TEST_CATALOG_IMAGE: dfirswarm-disk:dev-amd64
        run: npm run test:vm
