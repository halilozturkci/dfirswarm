# Everything here runs without a model, a provider key, Herdr or Pi: the
# protocol suite works on files, the web API suite on a local server, the
# shell suites on the scripts themselves and a scripted provider.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck · node tests · shell suites · ui build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout runs `git init` on the runner, and git prints its
      # init.defaultBranch hint unless one is configured.
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tools the shell suites use
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq python3 zsh bubblewrap util-linux iproute2 sqlite3
          jq --version && python3 --version && bash --version | head -1
      # Ubuntu 24.04 switches unprivileged user namespaces off for programs
      # without an AppArmor profile, and the guard suites then test nothing:
      # fsguard falls back to Landlock alone and says so. Switch them on here so
      # CI exercises the namespace modes; the second job below covers the
      # Landlock-only host on purpose.
      - name: What this host can enforce
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "userns: $(unshare -rm true 2>/dev/null && echo yes || echo no)"
          echo "netns:  $(unshare -rn true 2>/dev/null && echo yes || echo no)"
          echo "landlock ABI: $(python3 scripts/landlock.py --dry-run -- true | sed -n 's/^abi: //p')"
          echo "bwrap:  $(bwrap --version 2>/dev/null || echo none)"
          bash scripts/fsguard.sh --rw "$PWD" --dry-run -- true | head -4
      - run: npm ci
      # The Playwright tool test drives a real browser and skips its browser
      # half without one. The headless shell is what it launches.
      - name: Chromium for the Playwright tool test
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run typecheck
      # The browser is installed here, so its tests may not skip.
      - run: npm test
        env:
          SWARM_REQUIRE_BROWSER: "1"
      - run: npm run test:bash
      - run: npm run ui:build
      - name: Nothing from a run is tracked
        run: |
          if git ls-files | grep -E '^(runs/|sandbox-runs/|sandbox/\.pi|sandbox/traces/)' ; then
            echo "run state is tracked" >&2; exit 1
          fi

  node-floor:
    # The oldest Node the harness claims, run exactly: package.json engines
    # says >=22.19 because the pinned Pi and its undici declare 22.19.0 as
    # their own floor, and an older 22 cannot load the extension (measured on
    # 22.6.0: undici calls webidl.util.markAsUncloneable, which that Node has
    # not got, and every test that loads Pi fails). .nvmrc's 22 above is the
    # newest 22; this is the floor, so the claim is tested, not assumed.
    name: typecheck · node tests · Node 22.19 (the engines floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Tools the suites use
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq python3 zsh bubblewrap util-linux iproute2 sqlite3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          test "$(node --version)" = v22.19.0 || { echo "wanted Node v22.19.0, got $(node --version)" >&2; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  node-24:
    # Two Nodes run this harness. The host runs .nvmrc's 22 (package.json
    # engines >=22.19; the job above runs that floor exactly); inside a VM, Pi
    # runs the extensions on the image's Node, and images/base.Dockerfile
    # builds on node:24. The node suites again, on 24.
    name: node tests · Node 24 (the VM image's)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Tools the suites use
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq python3 zsh bubblewrap util-linux iproute2 sqlite3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          node --version
      - run: npm ci
      - run: npm test

  guards-without-namespaces:
    # The host a run meets inside an ordinary container, or on an Ubuntu with
    # its AppArmor restriction left on: no user namespaces, Landlock only.
    # The guard suites must pass there too, with the record saying what the
    # host could not enforce rather than the guard pretending.
    name: guard suites · Landlock only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq python3 zsh sqlite3
          sudo sysctl -w user.max_user_namespaces=0
          echo "userns: $(unshare -rm true 2>/dev/null && echo yes || echo no) (expected: no)"
          echo "landlock ABI: $(python3 scripts/landlock.py --dry-run -- true | sed -n 's/^abi: //p')"
      - run: npm ci
      - run: bash scripts/test-bash.sh write-guard herdr-seal inputs netguard trace-gate

  macos:
    # The platform the harness is developed and demoed on, and the one with
    # its own code paths: the seatbelt write guard (sandbox-exec), host panes
    # under it, --inputs-image (hdiutil), caffeinate and the battery check,
    # the synced-folder check, bash 3.2 and BSD tools. A hosted runner cannot
    # boot a microVM (no nested virtualisation), so the VM suite stays on the
    # Linux job below; everything else runs here. Docker is not on the runner:
    # evidence-image runs its hdiutil half and says it skipped the container
    # half. Herdr is not either: swarm-preflight skips its keyless-kickoff
    # check and says so.
    name: macOS · typecheck · node tests · shell suites
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tools the shell suites use
        run: |
          command -v jq >/dev/null || brew install jq
          jq --version && python3 --version && /bin/bash --version | head -1 && zsh --version
          sqlite3 --version
          echo "sandbox-exec: $(command -v sandbox-exec || echo none)"
      - run: npm ci
      - name: Chromium for the Playwright tool test
        run: npx playwright install --only-shell chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bash

  microvm:
    # Agents in microVMs (--isolation microvm), on real VMs: GitHub's Linux
    # runners expose /dev/kvm. The base image is built here from
    # images/base.Dockerfile rather than pulled, so a pull request that changes
    # it is tested with the change. Nothing is pushed from this repository:
    # images.yml builds every profile (and two for arm64) and checks each
    # from the inside; this job boots base and disk on every pull request, and
    # image-boot.yml boots every profile once a week.
    name: microVM · integration tests (KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The VM suite checks that a finish clears a removed VM's secret from
      # msb's database, which needs the sqlite3 CLI on the host; installed
      # here rather than trusted to the runner image.
      - name: sqlite3, for the msb database scrub
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sqlite3
          sqlite3 --version
      - name: KVM for this user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - run: npm ci
      - name: The base and disk images, built and loaded into msb
        run: |
          docker build -f images/base.Dockerfile -t dfirswarm-base:dev-amd64 images
          # disk as well: the catalog test needs The Sleuth Kit, and a pack
          # image that is only ever built and never booted is untested. Not
          # published, so the licence flag is for this runner only.
          python3 images/recipe.py build disk --out "$RUNNER_TEMP/disk" --base dfirswarm-base:dev-amd64 --allow-nonredistributable
          docker build -t dfirswarm-disk:dev-amd64 "$RUNNER_TEMP/disk"
          docker save dfirswarm-base:dev-amd64 -o "$RUNNER_TEMP/base.tar"
          docker save dfirswarm-disk:dev-amd64 -o "$RUNNER_TEMP/disk.tar"
          msb="$(node --experimental-strip-types --no-warnings scripts/vm.ts msb-path)"
          "$msb" doctor
          "$msb" load -i "$RUNNER_TEMP/base.tar"
          "$msb" load -i "$RUNNER_TEMP/disk.tar"
      - name: VM integration tests
        env:
          DFIRSWARM_VM_TESTS: "1"
          VM_TEST_CATALOG_IMAGE: dfirswarm-disk:dev-amd64
        run: npm run test:vm
