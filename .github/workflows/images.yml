# The agents' VM images, built from the packs and booted — never pushed from
# here. A package published from this public repository becomes public
# (measured: the first push of these images could be pulled anonymously),
# and an image bundles separately licensed programs that are not ours to
# redistribute until each licence has been reviewed. Prebuilt images are
# published from the private dfirswarm-pro repository, to private packages,
# except an image that carries pinned data (install.data: Volatility's symbol
# tables), which no workflow of ours pushes anywhere; Pro builds those per
# customer.
#
# What this does instead: builds the base and every profile for amd64 from
# the recipes, `full` included, as a community user would (images/README.md),
# and memory and re for arm64 as well, on GitHub's arm64 runner: the arm64
# pins and the wheels arm64 has to compile are exercised nowhere else. A
# build fails when a program its packs name is not in the image, optional
# or not, unless it is left out on purpose (install.py), and when a pinned
# download's sha256 is not what its pack says. Then each image is checked
# from the inside: its record holds the
# package lists a VM's inventory is diffed against at stop, and a fresh
# container diffs empty against them (scripts/vm.ts INVENTORY_SCRIPT, run
# as it is); its NOTICE and SBOM are there; data a pack pins (Volatility's
# Windows symbol tables) is on disk, was indexed, and passes the check its pack
# names for it, run again with no network (a pull request builds with
# --symbol-set none, so the record must say every symbol set was left out on
# purpose, apart from any failure; a manual run may name `broad`, the
# Foundation's 840 MB bundle; CI never fetches a Microsoft PDB and never
# builds the curated set); and
# the programs a run once lacked work (tests/image-programs.sh: a C compiler,
# a planted AES key schedule found, a steghide round trip). CI's microVM job
# boots base and disk on a runner with KVM on every pull request;
# image-boot.yml boots every profile, and base on arm64 where the runner has
# KVM, once a week.
name: images

on:
  pull_request:
    paths:
      - images/**
      - packs/*/requires/**
      - packs/*/pack.json
      - tests/image-programs.sh
      - .github/workflows/images.yml
  workflow_dispatch:
    inputs:
      symbol_set:
        description: "recipe.py build --symbol-set: none (a pull request's), or broad (the Foundation's windows.zip, 840 MB); never curated here"
        default: none
        type: choice
        options: [none, broad]

# A new push to a pull request cancels the runs the older push left behind (a
# queued run stops costing a macOS slot, a running one stops at once). Runs on
# pushes to main, on tags, on schedules and by hand get their own group (the
# run id) and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build · ${{ matrix.profile }}${{ matrix.arch == 'arm64' && ' · arm64' || '' }}
    strategy:
      fail-fast: false
      matrix:
        profile: [base, core, re, memory, disk, network, linux, mobile, macos, cloud, triage, web, full]
        arch: [amd64]
        include:
          - { profile: memory, arch: arm64 }
          - { profile: re, arch: arm64 }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      TAG: dev-${{ matrix.arch }}
      SYMBOL_SET: ${{ inputs.symbol_set || 'none' }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # For the inventory script only (scripts/vm.ts, node built-ins).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build
        run: |
          docker build -f images/base.Dockerfile -t "dfirswarm-base:$TAG" images
          if [ "${{ matrix.profile }}" != base ]; then
            # Built here, never pushed: the flag is for this runner's copy.
            python3 images/recipe.py build "${{ matrix.profile }}" --out ctx --base "dfirswarm-base:$TAG" --allow-nonredistributable --symbol-set "$SYMBOL_SET"
            docker build -t "dfirswarm-${{ matrix.profile }}:$TAG" ctx
          fi
      - name: What the image holds, and that a fresh one diffs empty against its record
        run: |
          image="dfirswarm-${{ matrix.profile }}:$TAG"
          docker image inspect "$image" --format 'size: {{.Size}} bytes; redistributable label: {{index .Config.Labels "dev.dfirswarm.redistributable"}}'
          docker run --rm "$image" python3 -c 'import json; r = json.load(open("/etc/dfirswarm/image.json")); print(json.dumps({"profile": r.get("profile"), "packs": r.get("packs"), "redistributable": r.get("redistributable"), "binaries_found": sum(1 for v in (r.get("binaries") or {}).values() if v), "binaries": len(r.get("binaries") or {}), "not_installed": r.get("not_installed")}))'
          node --experimental-strip-types --no-warnings -e 'import("./scripts/vm.ts").then((m) => process.stdout.write(m.INVENTORY_SCRIPT))' > "$RUNNER_TEMP/inventory.py"
          out="$(docker run --rm -i "$image" python3 - < "$RUNNER_TEMP/inventory.py" | tail -1)"
          echo "inventory against the image's own record: $out"
          python3 -c 'import json, sys; d = json.loads(sys.argv[1]); sys.exit(0 if d.get("baseline") is True and d.get("apt") == {} and d.get("venv") == {} else 1)' "$out" \
            || { echo "a fresh container is not what its record says it is: $out" >&2; exit 1; }
          docker run --rm "$image" sh -c 'test -s /etc/dfirswarm/NOTICE && python3 -c "import json; b = json.load(open(\"/etc/dfirswarm/sbom.json\")); assert b[\"bomFormat\"] == \"CycloneDX\" and b[\"components\"]; print(\"sbom:\", len(b[\"components\"]), \"components\")"'
      - name: Pinned data is in the image, was indexed, and passes its check with no network
        run: |
          image="dfirswarm-${{ matrix.profile }}:$TAG"
          # Every data file a pack pins (a symbol pack) is on disk at the size the build recorded,
          # was warmed, and none a pack asked for was left out.
          docker run --rm -e SYMBOL_SET "$image" python3 -c '
          import json, os, sys
          r = json.load(open("/etc/dfirswarm/image.json"))
          data = {k: v for k, v in (r.get("downloads") or {}).items() if v.get("kind") == "data"}
          left_out = (r.get("not_installed") or {}).get("data") or []
          omitted = (r.get("omitted") or {}).get("data") or []
          # A kept source is on disk at its size; a converted one is gone and its outputs are there instead.
          def bad_entry(v):
              files = [(v["path"], v.get("bytes"))] if v.get("path") else []
              files += [(o["path"], o.get("bytes")) for o in v.get("outputs") or []]
              return not files or any(not os.path.isfile(p) or os.path.getsize(p) != n for p, n in files) or v.get("warm") == "failed" or not v.get("check")
          bad = [k for k, v in data.items() if bad_entry(v)]
          # Under --symbol-set none no entry of a symbol set is built in, and every set a pack pins is said as omitted, never as a failure.
          wrong = os.environ.get("SYMBOL_SET") == "none" and any(v.get("set") for v in data.values())
          print("pinned data:", {k: v.get("bytes") for k, v in data.items()}, "left out (failed):", left_out, "omitted:", [o.get("name") for o in omitted], "bad:", bad)
          sys.exit(1 if left_out or bad or wrong else 0)'
          # Each data entry's own check (install.data `check`), run again in a fresh container with
          # no route out. A docker error fails the step; so does a check that does not succeed.
          docker run --rm "$image" python3 -c 'import json; r = json.load(open("/etc/dfirswarm/image.json")); print(json.dumps([[k, v["check"]] for k, v in (r.get("downloads") or {}).items() if v.get("kind") == "data" and v.get("check")]))' > "$RUNNER_TEMP/data-checks.json"
          python3 - "$image" "$RUNNER_TEMP/data-checks.json" <<'PY'
          import json, subprocess, sys, time
          image, path = sys.argv[1:3]
          for name, argv in json.load(open(path)):
              start = time.time()
              r = subprocess.run(["docker", "run", "--rm", "--network", "none", image, *argv])
              print(f"check of {name}: exit {r.returncode} in {time.time() - start:.0f} s (container start included)")
              if r.returncode != 0:
                  sys.exit(1)
          PY
      - name: The programs a run asked for work in the image
        run: |
          # tests/image-programs.sh: a C program compiles and runs, a planted AES key schedule is found,
          # a message embedded with steghide comes back; one the image's packs name and PATH lacks fails, one
          # the profile does not hold is skipped.
          docker run --rm -v "$PWD/tests:/t:ro" "dfirswarm-${{ matrix.profile }}:$TAG" sh /t/image-programs.sh
