# Hash lock for the encrypted-containers pack's Python packages: libbde-python, libvhdi-python, libluksde-python, pytsk3, dfvfs and pyAesCrypt, and everything dfvfs needs (the libyal bindings among them, libewf-python and libfvde-python too). PyPI publishes cp311 manylinux wheels for x86_64 and aarch64 for the libyal bindings and pytsk3, so the lines below hold a hash for each of those wheels and for the sdist; the sdist is what an architecture or glibc without a wheel compiles. The libyal and pytsk3 versions are the ones the base pack's plaso lock holds, since both install into one venv.
